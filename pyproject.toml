[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inflamma-screen"
version = "0.1.0"
description = "Educational screening toolkit for chronic inflammatory skin conditions"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Mitra Pai" }]
keywords = ["dermatology", "screening", "education", "inflammatory", "patient"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/developer-rpai/inflamma-screen"
Repository = "https://github.com/developer-rpai/inflamma-screen"

[tool.setuptools.packages.find]
where = ["."]
include = ["inflamma_screen*"]

[tool.setuptools.package-data]
inflamma_screen = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
